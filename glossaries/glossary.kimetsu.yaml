# =====================================================================
# glossary.kimetsu.yaml
# Bảng thuật ngữ, quan hệ xưng hô & phong cách dịch chuyên biệt cho series:
# "Kimetsu no Yaiba" (Demon Slayer / Thanh Gươm Diệt Quỷ)
# =====================================================================

meta:
  schema: 2
  pair: "ja-vi"
  description: "Kimetsu no Yaiba characters, Breathing Styles, Hashira titles, Twelve Kizuki, and style rules"
  genres: [historical, action, supernatural, shounen]

style_rules:
  - "CRITICAL ROMAJI RETENTION: Keep all character names in standard Romaji: Tanjiro, Nezuko, Zenitsu, Inosuke, Giyu, Shinobu, Rengoku, Kyojuro, Tengen, Uzui, Mitsuri, Muichiro, Gyomei, Sanemi, Obanai, Kanao, Genya, Ubuyashiki, Muzan, Kibutsuji, Akaza, Kokushibo, Doma, Gyutaro, Daki, Rui, Tamayo, Yushiro. NEVER transliterate character names into Sino-Vietnamese."
  - "BREATHING STYLES & RANKS: Render Breathing Styles naturally in Vietnamese ('Hơi thở của Nước', 'Hơi thở của Lửa', 'Hơi thở của Sấm Sét', 'Hơi thở của Mặt Trời / Điệu múa Hỏa Thần'), Hashira titles in canonical Sino-Vietnamese ('Thủy Trụ', 'Viêm Trụ', 'Âm Trụ', 'Trùng Trụ', 'Hà Trụ', 'Luyến Trụ', 'Phong Trụ', 'Xà Trụ', 'Nham Trụ'), and Upper/Lower Ranks as 'Thượng Huyền' / 'Hạ Huyền'."
  - "TANJIRO'S EARNEST ELDER-BROTHER TONE: Tanjiro is polite, compassionate, and respectful. With Hashira/elders: self='em' or 'con', other='anh Giyu' / 'anh Rengoku' / 'cô Shinobu' / 'Chúa công'. With Nezuko: self='anh', other='Nezuko' / 'em'. With Zenitsu & Inosuke: self='tớ' or 'tôi', other='Zenitsu' / 'Inosuke' / 'cậu'. With Muzan/demons: self='ta', other='ngươi'."
  - "INOSUKE & MUZAN: Inosuke speaks wildly and boastfully ('bổn đại gia / ta / tao - ngươi / mày'). Muzan speaks with cold, narcissistic supremacy ('ta - ngươi / lũ sâu bọ')."

difficulty_markers:
  - "全集中"
  - "ヒノカミ神楽"
  - "血鬼術"
  - "上弦"
  - "お館様"

address_rules:
  principle: "Giữ trọn không khí thời kỳ Taisho: Tanjiro lễ phép ấm áp, các Trụ cột uy nghiêm, Quỷ Thượng Huyền ngạo mạn và tên chiêu thức Hơi thở giàu nhịp điệu."
  relations:
    - case: "Tanjiro -> Nezuko (anh trai thương em gái)"
      self: "anh"
      other: "Nezuko"
    - case: "Tanjiro -> Các Trụ cột (Giyu, Rengoku, Tengen, Shinobu)"
      self: "em"
      other: "anh Giyu / anh Rengoku / anh Uzui / cô Shinobu"
    - case: "Các Trụ cột -> Chúa công Ubuyashiki (お館様)"
      self: "thần"
      other: "Chúa công"
      note: "Hoặc 'con - Chúa công' thể hiện lòng tôn kính tuyệt đối"

