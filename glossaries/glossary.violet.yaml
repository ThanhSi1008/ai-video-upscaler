# =====================================================================
# glossary.violet.yaml
# Bảng thuật ngữ, quan hệ xưng hô & phong cách dịch chuyên biệt cho series:
# "Violet Evergarden" (Búp Bê Ký Ức Tự Động)
# =====================================================================

meta:
  schema: 2
  pair: "ja-vi"
  description: "Violet Evergarden characters, military-epistolary register, Auto Memory Doll terms, and style rules"
  genres: [drama, historical, fantasy, slice_of_life]

style_rules:
  - "CRITICAL ROMAJI RETENTION: Keep all Western character and place names intact: Violet Evergarden, Gilbert Bougainvillea, Claudia Hodgins, Cattleya Baudelaire, Benedict Blue, Iris Cannary, Erica Brown, Dietfried, Luculia, Leiden, Leidenschaftlich."
  - "VIOLET'S FORMAL KEIGO & MILITARY DISCIPLINE: Violet speaks in ultra-formal, polite Vietnamese ('tôi - ngài/quý khách/cô/anh'). When speaking to or about Major Gilbert ('少佐'), she ALWAYS calls him 'Thiếu tá' (self: 'tôi', or 'em' ONLY in the final emotional letter/reunion climax when reciprocated). Her signature greeting MUST be natural and dignified: 'Nếu đó là điều quý khách mong muốn, Violet Evergarden xin sẵn sàng đi tới bất cứ nơi đâu.'"
  - "GILBERT'S GENTLE PROTECTIVE TONE: Major Gilbert speaks to Violet with deep tenderness and sorrow: self='ta' or 'anh' (use 'anh - em' in his confession '愛してる' -> 'Anh yêu em'), other='Violet' / 'em'."
  - "HODGINS & POSTAL COMPANY COLLEAGUES: Claudia Hodgins speaks like a caring guardian/older brother to Violet (self='tôi' or 'ta', other='Violet'). Cattleya speaks like a warm, mature older sister (self='chị' to Violet/Iris/Erica, 'tôi/em' to Hodgins)."

difficulty_markers:
  - "自動手記人形"
  - "愛してる"
  - "少佐"
  - "ライデンシャフトリヒ"

address_rules:
  principle: "Tôn trọng tuyệt đối văn phong thư tín lịch duyệt châu Âu cổ điển và tác phong quân ngũ trang nghiêm của Violet."
  relations:
    - case: "Violet -> Thiếu tá Gilbert (少佐)"
      self: "tôi"
      other: "Thiếu tá"
      note: "Kính cẩn tuyệt đối; câu '愛してる' của Thiếu tá dịch là 'Anh yêu em'"
    - case: "Gilbert -> Violet"
      self: "anh"
      other: "Violet"
      note: "Dịu dàng, trân trọng; khi giao mệnh lệnh quân sự có thể dùng 'ta - em/Violet'"
    - case: "Violet -> Khách hàng / Người lạ"
      self: "tôi"
      other: "quý khách / ngài / tiểu thư / phu nhân"

