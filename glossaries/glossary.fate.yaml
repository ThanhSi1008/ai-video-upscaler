# Bảng thuật ngữ & phong cách dịch chuyên biệt cho series:
# "Fate/stay night: Heaven's Feel" (Trilogy Movies I, II, III)
# Dựa trên thuật ngữ Type-Moon / Fate chuẩn xác và văn phong anime Việt Nam
# =====================================================================

meta:
  schema: 2
  pair: "ja-vi"
  description: "Fate/stay night: Heaven's Feel characters, pronouns, noble phantasms, magic concepts, and style rules"
  genres: [supernatural, battle, fantasy, dark_fantasy, mystery]

style_rules:
  - "CRITICAL: Character names MUST strictly retain standard Romaji spelling matching the English reference track: Shirou, Sakura, Rin, Saber, Archer, Shinji, Zouken, Kirei, Illya, Rider, Taiga, Gilgamesh, Assassin. NEVER transliterate into Sino-Vietnamese (ABSOLUTELY NO 'Sĩ Lang', 'Anh', 'Lẫm', 'Thận Nhị', 'Tạng Nghiễn', 'Khởi Lễ')."
  - "SAKURA'S ADDRESSING TO SHIROU: Sakura deeply loves and respects Shirou. In dialogue, when addressing Shirou, she calls him 'senpai' (hoặc 'anh Shirou'), and refers to herself as 'em' or drops pronouns naturally. Shirou addresses Sakura as 'Sakura' and refers to himself as 'anh' or 'tôi'."
  - "RIN & SHIROU DYNAMICS: Rin maintains a tsundere, capable, yet slightly distant high-school peer relationship with Shirou. When addressing Shirou, Rin calls him 'Emiya-kun' or 'Emiya' (trong tiếng Việt: 'Emiya' hoặc 'cậu'). She uses 'tôi - cậu' or 'tớ - cậu'. Shirou calls her 'Tohsaka' or 'cậu'."
  - "SABER'S SPEECH STYLE: Saber is a dignified, honorable knight-king. She speaks formally and stoically. She addresses Shirou as 'Shirou' or 'Master' and refers to herself as 'tôi' or 'ta'."
  - "KIREI'S SPEECH STYLE: Kotomine Kirei is the overseer priest of Fuyuki Church. He speaks with calm, deep, philosophical authority. He refers to himself as 'ta' and addresses others as 'ngươi' or 'cậu'."
  - "ILLYA'S SPEECH STYLE: Illyasviel calls Shirou 'Onii-chan' ('anh hai' / 'anh Shirou'). She switches between an innocent child and a ruthless master."
  - "ZOUKEN'S SPEECH STYLE: Matou Zouken is an ancient, grotesque magus who uses crest worms. He speaks with an old, raspy, arrogant voice ('lão' / 'ta' - 'ngươi' / 'các ngươi')."
  - "TERMINOLOGY FIDELITY: Always translate Type-Moon / Fate core terms accurately: 'Cuộc chiến Chén Thánh' (Holy Grail War / 聖杯戦争), 'Chén Thánh' (Holy Grail / 聖杯), 'Lệnh Chú' (Command Spells / 令呪), 'Bảo Cụ' (Noble Phantasm / 宝具), 'Ma thuật sư' (Magus / 魔術師), 'Ma thuật' (Magecraft / 魔術), 'Đại Pháp' (True Magic / 魔法), 'Mạch ma thuật' (Magic Circuits / 魔術回路), 'Chiếc Bóng' (The Shadow / 影)."

