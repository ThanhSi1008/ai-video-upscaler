style_rules:
  - "CRITICAL: ALWAYS keep proper character names, family/clan names, and palace names in exact Romaji matching the English reference track (e.g. Reirin, Keigetsu, Kou, Shu, Gayou, Leelee)."
  - "NEVER translate proper names into Sino-Vietnamese (Hán-Việt) or Vietnamese words (ABSOLUTELY NO 'Linh Lâm', 'Huệ Nguyệt', 'Tuệ Nguyệt', 'Chu', 'Hoàng', 'Thư', 'Kim', 'Huyền', 'Lợi Lợi')."
  - "Keep palace and consort titles combined naturally: 'cung Shuku', 'cung Kouki', 'Quý phi Shu', 'Quý phi Kou', 'gia tộc Kou', 'gia tộc Shu'."

