# =====================================================================
# glossary.tenken.yaml
# Bảng thuật ngữ & phong cách dịch chuyên biệt cho anime:
# "Tensei Shitara Ken Deshita" (Reincarnated as a Sword / Chuyển Sinh Thành Kiếm)
# Dựa trên dữ liệu chuẩn đối soát từ 11 tập Season 1 B-Global Official Subtitles
# =====================================================================

meta:
  schema: 2
  pair: "ja-vi"
  description: "Tensei Shitara Ken Deshita specific terms, characters, magic skills, and style rules"
  genres: [isekai, fantasy, adventure, action]

style_rules:
  - "CRITICAL: Character proper names MUST strictly follow standard Romaji/English anime localization: Fran, Shishou (Sư phụ), Urushi, Jean Doubee (Jean du Vix), Bernard, Amanda, Nell, Klimt, Garrus, Donadrond. NEVER transliterate into Sino-Vietnamese (ABSOLUTELY NO 'Pháp Lạp', 'Ô Lỗ Thi', 'A Mạn Đạt', 'Nhĩ', 'Khắc Lâm Mỗ Đặc')."
  - "FRAN'S SPEECH STYLE: Fran is a laconic, stoic 12-year-old Black Cat Beastkin. Her sentences are short, direct, and unembellished (e.g. 'Sư phụ, đi thôi.', 'Ngon lắm.', 'Được rồi.', 'Cảm ơn em, Urushi.'). When talking to Shishou, she calls him 'Sư phụ' and refers to herself as 'Fran' or 'con'/'em' (or drops pronouns naturally)."
  - "SHISHOU'S SPEECH STYLE: Shishou (Teacher/Master) acts as a caring guardian, mentor, and sword. In internal monologues (suy nghĩ nội tâm), he refers to himself as 'mình' or 'tôi'. When telepathically talking to Fran, he addresses her as 'Fran' and refers to himself as 'ta' or 'tôi'."
  - "WOLF URUSHI: The darkness wolf companion is named 'Urushi' (NOT 'Jet' from English fan releases). Shishou and Fran treat Urushi with love. Urushi's vocalizations are natural wolf/dog sounds ('Gâu!', 'Oẳng!', 'Hú!')."
  - "JEAN DOUBEE (Season 2): An eccentric, theatrical necromancer. He speaks in an elevated, theatrical tone ('Ta là Jean Doubee vĩ đại!', 'Ngươi...', 'Cấm ăn thêm bát thứ ba đấy')."
  - "TERMINOLOGY FIDELITY: Always translate core RPG terms accurately: 'Hội mạo hiểm giả' (Adventurer Guild), 'Mạo hiểm giả' (Adventurer), 'Hắc Miêu tộc' (Black Cat Tribe), 'Thẩm định' (Appraisal), 'Thần giao cách cảm' (Telepathy), 'Tự tiến hóa' (Self-Evolution), 'Ma kiếm' (Magic Sword), 'Ma thú' (Demonic Beast), 'Hầm ngục' (Dungeon), 'Đảo nổi' (Floating/Sky Island), 'Thuật chiêu hồn' (Necromancy)."

