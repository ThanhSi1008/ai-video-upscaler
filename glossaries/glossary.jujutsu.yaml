# =====================================================================
# glossary.jujutsu.yaml
# Bảng thuật ngữ, quan hệ xưng hô & phong cách dịch chuyên biệt cho series:
# "Jujutsu Kaisen" (Chú Thuật Hồi Chiến)
# =====================================================================

meta:
  schema: 2
  pair: "ja-vi"
  description: "Jujutsu Kaisen characters, cursed techniques, Domain Expansions, and style rules"
  genres: [supernatural, battle, dark_fantasy, shounen]

style_rules:
  - "CRITICAL ROMAJI RETENTION: Keep all character names in standard Romaji: Yuji, Itadori, Megumi, Fushiguro, Nobara, Kugisaki, Gojo, Satoru, Sukuna, Suguru, Geto, Nanami, Kento, Todo, Maki, Toge, Inumaki, Panda, Yuta, Okkotsu, Mahito, Jogo, Hanami, Choso, Toji, Kenjaku. NEVER transliterate character names into Sino-Vietnamese."
  - "JUJUTSU TERMINOLOGY: Cursed Techniques, Domain Expansions, and Jujutsu ranks MUST use canonical Sino-Vietnamese anime terms: 'Chú lực' (呪力), 'Thuật thức' (術式), 'Lãnh địa triển khai' (領域展開), 'Hắc Thiểm' (黒閃), 'Phản chuyển thuật thức' (反転術式), 'Vô Lượng Không Xứ' (無量空処), 'Phục Ma Ngự Trù Tử' (伏魔御廚子), 'Chú thuật sư Đặc cấp' (特級呪術師)."
  - "GOJO SATORU'S DYNAMIC REGISTER: Gojo refers to himself as 'thầy' ('僕' playful mentor) when speaking to his students (Yuji, Megumi, Nobara, Yuta), switches to 'tớ / tao - Suguru / mày' with his best friend Geto Suguru, and uses arrogant 'ta - ngươi / lũ thượng tầng' when crushing curses or mocking elders."
  - "RYOMEN SUKUNA'S KING OF CURSES REGISTER: Sukuna ALWAYS speaks with supreme arrogance: self='ta', other='ngươi' / 'thằng nhóc' (小僧) / 'lũ rác rưởi'."
  - "STUDENT TRIO (YUJI, MEGUMI, NOBARA): Peers use natural teen speech ('tôi - cậu' or 'tớ - cậu'; Nobara uses bold 'tôi/bà đây - cậu/tên ngốc'; all three call Gojo 'thầy Gojo' and self='em')."

difficulty_markers:
  - "領域展開"
  - "無量空処"
  - "伏魔御廚子"
  - "反転術式"
  - "無下限呪術"
  - "十種影法術"
  - "天与呪縛"

address_rules:
  principle: "Phân tách rạch ròi giữa tên riêng Romaji và hệ thống thuật ngữ Chú thuật Hán-Việt chuẩn mực; giữ trọn cá tính ngạo nghễ của Gojo/Sukuna và chất học đường của nhóm Yuji."
  relations:
    - case: "Gojo -> Học trò (Yuji, Megumi, Nobara, Yuta)"
      self: "thầy"
      other: "em / các em / Yuji / Megumi"
    - case: "Học trò -> Gojo Satoru"
      self: "em"
      other: "thầy Gojo"
    - case: "Gojo <-> Geto Suguru (bạn thân thời cao chuyên)"
      self: "tớ"
      other: "Suguru / Satoru / cậu"
      note: "Khi tranh cãi gay gắt có thể đổi sang 'tôi - cậu'"
    - case: "Sukuna -> Mọi đối tượng"
      self: "ta"
      other: "ngươi / thằng nhóc"

