# =====================================================================
# glossary.frieren.yaml
# Bảng thuật ngữ, quan hệ xưng hô & phong cách dịch chuyên biệt cho series:
# "Sousou no Frieren" (Frieren: Beyond Journey's End / Pháp Sư Tiễn Táng)
# =====================================================================

meta:
  schema: 2
  pair: "ja-vi"
  description: "Sousou no Frieren characters, pronouns, magic spells, mage exam ranks, and style rules"
  genres: [fantasy, adventure, drama, slice_of_life]

style_rules:
  - "CRITICAL ROMAJI RETENTION: Character names MUST retain standard Romaji/Germanic spelling: Frieren, Fern, Stark, Himmel, Heiter, Eisen, Sein, Serie, Flamme, Aura, Qual, Denken, Übel (hoặc Ubel), Land, Wirbel, Lawine, Kanne, Lernen, Genau, Sense. NEVER transliterate into Sino-Vietnamese."
  - "FERN'S POLITE SPEECH (KEIGO): Fern ALWAYS speaks politely using desu/masu and honorific '-sama' even when scolding Frieren or Stark. Fern calls Frieren 'cô Frieren' (self: 'con' or 'em'), calls Stark 'cậu Stark' (self: 'tôi' or 'em' tùy mạch nhưng giữ lịch sự, chuẩn nhất: self='tôi', other='cậu Stark'), and calls Heiter 'ngài Heiter' / 'cha Heiter' (self: 'con')."
  - "FRIEREN'S CALM TIMELESS TONE: Frieren is an ancient elf mage with a calm, detached yet warm tone. With Fern & Stark: self='ta' or 'cô', other='Fern' / 'Stark' / 'em'. With Himmel, Heiter, Eisen: self='tôi', other='Himmel' / 'Heiter' / 'Eisen' / 'cậu'. With Flamme: self='em' / 'con', other='sư phụ' / 'cô Flamme'. With demons (Aura, Qual) or Serie: self='ta', other='ngươi' / 'bà'."
  - "STARK & FERN PEER DYNAMIC: Stark speaks casually and earnestly. With Fern: self='tớ' or 'tôi', other='Fern' or 'cậu'. With Frieren: self='cháu' or 'em', other='cô Frieren' or 'bà lão Frieren' (when joking). With Eisen: self='con', other='sư phụ'."
  - "SERIE & ANCIENT DEMONS: Serie, Aura, and Great Demons speak with ancient authority: self='ta', other='ngươi' / 'các ngươi'."

difficulty_markers:
  - "ゾルトラーク"
  - "アゼリューゼ"
  - "オレオール"
  - "一級魔法使い"
  - "大魔族"
  - "魔力制限"

address_rules:
  principle: "Giữ trọn nét lễ phép đặc trưng của Fern ('cô Frieren', 'cậu Stark'), chất điềm tĩnh cổ xưa của Frieren và sự hoài niệm ấm áp của nhóm Dũng giả Himmel."
  relations:
    - case: "Fern -> Frieren (học trò lễ phép nhưng hay cằn nhằn sư phụ)"
      self: "em"
      other: "cô Frieren"
      note: "Giữ ngữ khí lịch sự kể cả khi dỗi"
    - case: "Fern -> Stark (lịch sự gọi シュタルク様)"
      self: "tôi"
      other: "cậu Stark"
      note: "Tuyệt đối không dịch シュタルク様 thành 'ngài Stark' cứng nhắc hay 'mày/tao' thô lỗ"
    - case: "Frieren -> Fern / Stark"
      self: "ta"
      other: "Fern / Stark"
      note: "Có thể dùng 'cô - em' ở cảnh dịu dàng đời thường"
    - case: "Himmel -> Frieren"
      self: "tôi"
      other: "Frieren"
      note: "Ôn nhu, trân trọng; ở cảnh tâm tình sâu lắng có thể dùng 'anh - em/Frieren'"

