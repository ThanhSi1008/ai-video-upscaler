[pytest]
pythonpath = .
testpaths = tests subtrans/tests
cache_dir = .cache/pytest_cache
addopts = -q --tb=short --strict-markers -ra
markers =
    unit: fast offline unit tests (non-E2E, non-GPU)
    subtrans: anime subtitle translation engine tests (subtrans/tests/)
    e2e: multi-tier end-to-end integration and acceptance tests (tests/e2e/)
    gpu: mark test as GPU benchmark requiring CUDA/GPU hardware, run separately via RUN_GPU_TESTS=1
    web: local Web Studio FastAPI, SSE, JobManager, and frontend asset tests (tests/test_web_gui.py)
    smoke: fast (<5s) CPU-safe end-to-end FFmpeg/dedup/mux pipeline smoke verification (tests/test_smoke_pipeline.py)
