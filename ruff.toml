# Ruff configuration for fast, zero-side-effect linting by developers & AI Agents
target-version = "py311"
line-length = 120
cache-dir = ".cache/ruff_cache"

exclude = [
  ".git",
  ".venv",
  "venv",
  "bin",
  ".cache",
  ".ruff_cache",
  "__pycache__",
  ".pytest_cache",
  "scratch",
  "out",
  "logs",
  "models_bench",
  "samples",
  "test_frames",
  "archive_subtitles",
]

[lint]
# Focus on correctness bugs, undefined names, unused imports, and security pitfalls
select = ["E9", "F63", "F7", "F82", "B006", "PLE"]
ignore = []

[lint.per-file-ignores]
"tests/**/*.py" = ["B006"]
"subtrans/tests/**/*.py" = ["B006"]
