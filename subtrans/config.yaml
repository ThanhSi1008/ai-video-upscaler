# subtrans/config.yaml
# Configuration for anime subtitle translation (Verified against Google official docs 2026-10-01)

gemini:
  model: "gemini-3.8-flash"  # Primary cloud model (Stable 3.x Flash)
  fallback_models:
    - "gemini-3.7-flash"
    - "gemini-3.6-flash"
  lite_model: "gemini-3.5-flash-lite"
  max_rpm: 5  # Free Tier limit per model
  max_rpd: 1500

ollama:
  endpoint: "http://localhost:11434"
  model: "translategemma:12b"
  review_model: "gemma3:12b"
  num_ctx: 4096

translation:
  batch_size: 50
  local_batch_size: 20
  skip_styles: "(?i)(op|ed|sign|song|karaoke|title|credit)"
  en_overlap_threshold: 0.5
  en_match_warning_pct: 0.8
  line_max_chars: 42
  allow_silent_fallback: false  # Do NOT silently switch models mid-episode on 429 quota; pause and wait instead
  validate_batch_pronouns: true # Assert pronoun consistency across batches

privacy:
  mode: "allow_cloud"  # "allow_cloud" or "local_only"
  consent_given: false
