# =====================================================================
# glossary.yaml - Bo thuat ngu NEN (base) cho subtrans, dich Nhat/Anh -> Viet
# Schema v2. Dung chung cho MOI the loai anime.
#
# CACH DUNG
#  - File nay la lop nen. Moi bo anime cu the nen co them mot file rieng
#    glossary.<ten-bo>.yaml (cung schema); file rieng DUOC UU TIEN hon file nen.
#  - style_rules va address_rules luon duoc gui kem moi lo dich (giu ngan).
#  - terms chi duoc gui kem khi ja / en / zh / aliases XUAT HIEN trong lo dich.
#  - `vi` la cach dich mac dinh; `alt` la cac cach hop le khac tuy ngu canh;
#    `note` giai thich khi nao dung cai nao. `genre` de loc bang --genres.
#  - Ten nhan vat, ky nang, dia danh RIENG cua tung bo: dat o `characters`
#    hoac trong file glossary.<ten-bo>.yaml (dung `subtrans glossary-seed`
#    de lay danh sach ung vien, sau do tu duyet).
# =====================================================================

meta:
  schema: 2
  pair: "ja-vi"
  description: "Base glossary for general anime (all genres). Per-series files override it."
  genres: [common, titles, school, romcom, isekai, battle, supernatural, scifi, military, sports, idol, culture, food, xianxia]

# ---------------------------------------------------------------------
# style_rules: luon duoc gui kem. Viet bang tieng Anh de model hieu chinh xac.
# ---------------------------------------------------------------------
style_rules:
  - "Japanese is the source of truth; the English line is only an aid for disambiguation (speaker, addressee, omitted subjects, idioms)."
  - "Write natural, concise spoken Vietnamese suitable for subtitles. Never translate word for word."
  - "Choose Vietnamese pronouns from the speaker-to-listener relationship (age, rank, intimacy, gender, setting) and keep each character's pronouns consistent across the whole series."
  - "Do not translate Japanese honorifics literally. Follow address_rules and the terms table. Do not leave -san/-kun/-chan/-sama in the Vietnamese unless a term entry says so."
  - "Character, clan, family, and palace names: use the spelling in the glossary. If absent, ALWAYS use the Romaji spelling exactly as it appears in the English track (e.g. Reirin, Keigetsu, Kou, Shu, Gayou). NEVER translate proper names or clan names into Sino-Vietnamese (Hán-Việt) or Vietnamese words (ABSOLUTELY NO 'Linh Lâm', 'Huệ Nguyệt', 'Tuệ Nguyệt', 'Chu', 'Hoàng', 'Thư', 'Kim', 'Lợi Lợi')."
  - "Place names, organizations, palaces, and named techniques not in the glossary: keep the English-track romanization and translate only descriptive parts (e.g. 'cung Shuku', 'cung Kouki', 'Quý phi Shu')."
  - "Do not translate or add laughs or breaths in spoken dialogue. For standalone sound effects in parentheses (e.g. （鳥のさえずり）), translate the sound concisely in parentheses (e.g. (tiếng chim hót)); never leave a cue empty."
  - "Keep each cue's content inside that cue: never merge, split, reorder, or drop cues. Maximum 2 lines, about 42 characters per line."
  - "No translator notes or explanations in parentheses unless a term entry's note requires it."
  - "Match register: keep rude, polite, archaic, childish, or dialect speech recognizable in Vietnamese, without censoring or toning down."
  - "Use '...' for trailing off. Never stack more than two '!' or '?'."
  - "When a term has an entry in terms, use its vi (or one of its alt, as the note directs). Do not mix variants for the same term."

# ---------------------------------------------------------------------
# address_rules: xung ho. Luon duoc gui kem.
# ---------------------------------------------------------------------
address_rules:
  principle: "Decide pronouns per speaker-listener pair, not per sentence. Prefer the pair already established for those two characters in the series glossary or earlier cues."

  first_person:
    - {ja: "私 / わたし", vi: "tôi", alt: ["em", "tớ", "mình"], note: "Neutral/polite adults: tôi. Female or junior speaking politely to a senior: em. Friendly teenage girls: tớ/mình."}
    - {ja: "あたし", vi: "tớ", alt: ["em", "mình"], note: "Casual feminine speech."}
    - {ja: "僕 / ぼく", vi: "tớ", alt: ["tôi", "em", "mình"], note: "Boys and gentle men. Polite adult: tôi. To an elder or senior: em."}
    - {ja: "俺 / オレ", vi: "tôi", alt: ["tao", "tớ", "anh"], note: "Default neutral male: tôi. Rough, hostile, or very close male friends: tao (pair with mày). Casual friends: tớ. Older male to a younger person or girlfriend: anh."}
    - {ja: "自分", vi: "tôi", note: "Military and sports register: tôi."}
    - {ja: "儂 / わし", vi: "ta", alt: ["lão", "ông đây"], note: "Elderly male speech."}
    - {ja: "我 / 吾 / われ", vi: "ta", note: "Archaic or arrogant speech."}
    - {ja: "拙者", vi: "tại hạ", note: "Samurai/period setting."}
    - {ja: "余", vi: "ta", alt: ["trẫm"], note: "Arrogant rulers: ta. Emperors: trẫm."}
    - {ja: "朕", vi: "trẫm", note: "Emperor."}
    - {ja: "うち", vi: "tớ", alt: ["em", "mình"], note: "Often Kansai-dialect female speech."}
    - {ja: "(self-naming by own name)", vi: "dùng tên riêng", alt: ["em"], note: "Childish or cutesy characters who refer to themselves by name: keep the name or use em."}

  second_person:
    - {ja: "あなた", vi: "anh", alt: ["chị", "cô", "ông", "bà", "ngài", "bạn", "mình"], note: "Choose by age and politeness. Wife to husband or lovers: anh/mình."}
    - {ja: "君 / きみ", vi: "cậu", alt: ["em", "bạn", "anh"], note: "Male speaker to peers: cậu. To a younger girl: em. Formal and gentle: bạn."}
    - {ja: "お前 / おまえ", vi: "cậu", alt: ["mày", "ngươi", "anh"], note: "Rough: mày. Close male friends: cậu. Arrogant, period, or villain speech: ngươi."}
    - {ja: "あんた", vi: "anh", alt: ["bà", "ông", "cô", "mày"], note: "Rude or very familiar; choose by age and gender."}
    - {ja: "てめえ / 貴様 / きさま", vi: "mày", alt: ["ngươi", "tên khốn"], note: "Hostile. Archaic or military: ngươi."}
    - {ja: "君たち / お前ら / あんたたち", vi: "các cậu", alt: ["chúng mày", "các ngươi"], note: "Match the singular register."}
    - {ja: "(calling by name)", vi: "giữ nguyên tên", note: "Add kinship/title (anh/chị/em/cô/thầy) only when the relationship needs it."}

  honorifics:
    - {ja: "〜さん", vi: "(bỏ)", alt: ["anh + tên", "chị + tên", "cô + tên", "chú + tên", "bác + tên", "ông + tên", "bà + tên"], note: "Drop the suffix or convert to a kinship/title term by age. Do not leave -san."}
    - {ja: "〜くん", vi: "(bỏ)", alt: ["cậu + tên", "em + tên"], note: "Boys and juniors. Use em + tên when speaking to a younger person."}
    - {ja: "〜ちゃん", vi: "(bỏ)", alt: ["em + tên", "bé + tên"], note: "Affectionate; use em/bé for children and younger girls."}
    - {ja: "〜様 / さま", vi: "ngài", alt: ["quý", "chủ nhân", "(bỏ)"], note: "Customers: quý khách. Maid/servant to master: chủ nhân. Otherwise ngài or drop."}
    - {ja: "〜殿 / どの", vi: "ngài", alt: ["các hạ"], note: "Period/samurai setting."}
    - {ja: "先輩 / senpai", vi: "anh + tên", alt: ["chị + tên", "tiền bối", "senpai"], note: "Use anh/chị by gender in school settings. Use tiền bối in formal, work, martial, or military settings. Keep senpai only if the scene plays on the word."}
    - {ja: "後輩 / kouhai", vi: "đàn em", alt: ["hậu bối"], note: "As a noun. Address the person as em."}
    - {ja: "先生 / sensei", vi: "thầy", alt: ["cô", "bác sĩ", "sensei"], note: "Teacher/mentor: thầy or cô by gender. Doctor: bác sĩ. Authors, lawyers, and others: ngài/thầy or keep sensei."}
    - {ja: "お兄ちゃん / お兄さん / 兄さん", vi: "anh", alt: ["anh hai"], note: "Younger sibling or kid addressing an older brother."}
    - {ja: "お姉ちゃん / お姉さん / 姉さん", vi: "chị", alt: ["chị hai"], note: "Younger sibling or kid addressing an older sister."}
    - {ja: "兄貴 / あにき", vi: "đại ca", alt: ["anh cả"], note: "Gang or rough male bonds: đại ca. Family: anh cả."}
    - {ja: "姐さん / 姐御", vi: "chị đại", alt: ["đại tỷ"], note: "Gang or tough female leader."}
    - {ja: "おじさん / おばさん", vi: "chú", alt: ["bác", "cô", "dì"], note: "Pick by age and gender; do not translate literally as uncle/aunt unless family."}
    - {ja: "おじいさん / おばあさん", vi: "ông", alt: ["bà", "cụ"], note: "Elderly people; grandparents."}
    - {ja: "お父さん / 父上 / 親父", vi: "bố", alt: ["cha", "ba"], note: "Child to father: bố. Archaic: cha. Rude: ông già."}
    - {ja: "お母さん / 母上 / おふくろ", vi: "mẹ", alt: ["má", "mẫu thân"], note: "Archaic: mẫu thân. Rude: bà già."}

  relations:
    - {case: "classmates / friends of similar age (casual)", self: "tớ", other: "cậu", note: "Default for teen friends. Polite or distant: mình - bạn, or tôi - cậu."}
    - {case: "hostile / rough male peers", self: "tao", other: "mày", note: "Only with real aggression or very rough closeness."}
    - {case: "junior to senior (school, club, workplace)", self: "em", other: "anh / chị", note: "Add tên or chức danh when needed."}
    - {case: "senior to junior", self: "anh / chị", other: "em", note: "Cold or stern senior: tôi - cậu / cô."}
    - {case: "teacher to student", self: "thầy / cô", other: "em", note: "Strict teacher may use tôi - các em."}
    - {case: "student to teacher", self: "em", other: "thầy / cô"}
    - {case: "boss to subordinate", self: "tôi", other: "cậu / anh / cô", note: "Chức danh as address is fine."}
    - {case: "subordinate to boss", self: "tôi / em / cháu", other: "sếp / giám đốc / ngài", note: "Match formality of the office."}
    - {case: "parent to child", self: "bố / mẹ", other: "con"}
    - {case: "child to parent", self: "con", other: "bố / mẹ"}
    - {case: "older sibling to younger", self: "anh / chị", other: "em"}
    - {case: "younger sibling to older", self: "em", other: "anh / chị"}
    - {case: "grandparent to grandchild", self: "ông / bà", other: "cháu"}
    - {case: "lovers / spouses", self: "anh / em", other: "em / anh", note: "Or mình - cậu for same-age teens."}
    - {case: "nobles, royalty, samurai, period drama", self: "ta / thần / tại hạ", other: "ngươi / ngài / bệ hạ / điện hạ", note: "Subject to the speaker's rank."}
    - {case: "gods, demons, powerful elders, arrogant villains", self: "ta", other: "ngươi"}
    - {case: "xianxia / cultivation (donghua)", self: "ta / tại hạ / vãn bối", other: "ngươi / các hạ / đạo hữu / tiền bối", note: "Use the xianxia genre terms for sect titles."}
    - {case: "inner monologue / narration", self: "tôi / tớ", other: "-", note: "Use the pronoun that fits the narrator's gender, age, and voice."}

# ---------------------------------------------------------------------
# terms: thuat ngu. Dinh dang: ja, en, (zh), aliases, vi, alt, note, genre.
# ---------------------------------------------------------------------
terms:
  # ----- common: loi chao, thanh ngu, cam than -----
  - {ja: "いただきます", en: "itadakimasu", vi: "Xin phép ăn nhé", alt: ["Mời cả nhà ăn cơm", "Con xin phép ăn", "Tôi xin phép ăn"], note: "Said before eating; choose by speaker and audience.", genre: common}
  - {ja: "ごちそうさま", en: "gochisousama", aliases: ["ごちそうさまでした"], vi: "Cảm ơn vì bữa ăn", alt: ["Con ăn xong rồi", "Ngon quá"], note: "After eating.", genre: common}
  - {ja: "ただいま", en: "I'm home", vi: "Tôi về rồi", alt: ["Con về rồi", "Anh về rồi", "Em về rồi"], note: "Pick the subject by the relationship.", genre: common}
  - {ja: "おかえり", en: "welcome back", aliases: ["おかえりなさい"], vi: "Về rồi à", alt: ["Mừng con về", "Mừng anh về", "Mừng em về"], genre: common}
  - {ja: "いってきます", en: "I'm off", aliases: ["行ってきます"], vi: "Tôi đi đây", alt: ["Con đi đây", "Anh đi đây", "Em đi đây"], genre: common}
  - {ja: "いってらっしゃい", en: "have a safe trip", aliases: ["行ってらっしゃい"], vi: "Đi nhé", alt: ["Đi cẩn thận nhé", "Con đi nhé"], genre: common}
  - {ja: "よろしくお願いします", en: "nice to meet you", aliases: ["よろしく"], vi: "Mong được giúp đỡ", alt: ["Rất vui được gặp", "Nhờ cậu giúp nhé", "Mong anh chiếu cố"], note: "Context decides: introduction, request, or farewell.", genre: common}
  - {ja: "お疲れ様", en: "good work", aliases: ["お疲れさま", "お疲れ"], vi: "Vất vả rồi", alt: ["Hôm nay vất vả rồi", "Cảm ơn vì đã vất vả"], note: "Greeting among colleagues and club mates. Avoid the literal 'you are tired'.", genre: common}
  - {ja: "すみません", en: "excuse me", aliases: ["sorry", "すいません"], vi: "Xin lỗi", alt: ["Cảm ơn", "Xin hỏi một chút", "Làm phiền rồi"], note: "Decide by context: apology, gratitude, or getting attention.", genre: common}
  - {ja: "頑張って", en: "do your best", aliases: ["がんばって", "頑張れ", "がんばれ"], vi: "Cố lên!", alt: ["Cố gắng nhé", "Cố hết sức nhé"], genre: common}
  - {ja: "大丈夫", en: "it's okay", aliases: ["I'm fine", "だいじょうぶ"], vi: "Không sao", alt: ["Ổn mà", "Không sao đâu", "Đừng lo"], genre: common}
  - {ja: "お邪魔します", en: "excuse the intrusion", vi: "Xin phép làm phiền", alt: ["Cháu xin phép vào ạ", "Em xin phép vào"], note: "When entering someone's home.", genre: common}
  - {ja: "失礼します", en: "excuse me", aliases: ["失礼しました"], vi: "Xin phép", alt: ["Em xin phép vào ạ", "Tôi xin phép đi trước", "Thất lễ rồi"], note: "Entering, leaving, or apologizing for rudeness.", genre: common}
  - {ja: "くそ", en: "damn", aliases: ["クソ", "ちくしょう"], vi: "Chết tiệt", alt: ["Khốn kiếp", "Mẹ kiếp"], note: "Match the intensity of the scene.", genre: common}
  - {ja: "まさか", en: "no way", vi: "Không lẽ nào", alt: ["Không thể nào", "Sao có thể chứ"], genre: common}
  - {ja: "なるほど", en: "I see", vi: "Ra là vậy", alt: ["Hiểu rồi", "À, ra thế"], genre: common}
  - {ja: "やれやれ", en: "good grief", vi: "Thật là...", alt: ["Hầy"], genre: common}
  - {ja: "ふざけるな", en: "don't mess with me", aliases: ["ふざけんな"], vi: "Đừng có đùa", alt: ["Đừng giỡn mặt", "Đừng đùa với tôi"], genre: common}
  - {ja: "バカ", en: "idiot", aliases: ["馬鹿", "ばか"], vi: "Đồ ngốc", alt: ["Đồ ngu", "Ngốc ạ", "Đồ khờ"], note: "Affectionate teasing: ngốc/khờ. Insult: đồ ngu.", genre: common}
  - {ja: "気をつけて", en: "be careful", vi: "Cẩn thận nhé", genre: common}
  - {ja: "約束", en: "promise", vi: "lời hứa", alt: ["hẹn", "giao kèo"], genre: common}

  # ----- titles: chuc danh, cap bac, xa hoi -----
